# Render Blueprint: the public demo of Relay (free plan).
# Data lives in a free PostgreSQL (Neon). DEMO_RESET_ON_START wipes it and recreates the
# sample data each time the free instance wakes up, so visitors always see a clean demo.
services:
  - type: web
    name: relay-whatsapp-ai-agent
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w apps/web
    startCommand: cd apps/api && npx tsx src/server.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_RESET_ON_START
        value: "true"
      # connection string of the demo database, set in the Render dashboard
      - key: DATABASE_URL
        sync: false
      # Requests reach the app through Cloudflare, the Render load balancer and the
      # instance proxy; limits count the visitor behind those three
      - key: TRUST_PROXY_HOPS
        value: "3"
      - key: WEB_DIR
        value: /opt/render/project/src/apps/web/dist
      # optional: Claude answers instead of the free demo responder
      - key: ANTHROPIC_API_KEY
        sync: false
