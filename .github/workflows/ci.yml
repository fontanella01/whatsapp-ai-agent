name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (API and web)
        run: npm run typecheck
      - name: Test API (PostgreSQL via PGlite, no external services)
        run: npm test
      - name: Build web
        run: npm run build -w apps/web
