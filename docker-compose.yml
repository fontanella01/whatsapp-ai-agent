# Runs Relay with a real PostgreSQL:  docker compose up --build  ->  http://localhost:3333
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 2s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3333:3333"
    environment:
      DATABASE_URL: postgres://relay:relay@db:5432/relay
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me-0123456789}
      DEMO_MODE: "true"
      # optional: set it in your shell or a .env file next to this one
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

volumes:
  db-data:
